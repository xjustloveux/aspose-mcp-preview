version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps):"
    ignore:
      # semantic-release v26 requires Node >=26.13 and pulls in beta packages;
      # the Release workflow runs on Node 22.
      - dependency-name: "semantic-release"
        update-types: ["version-update:semver-major"]
    groups:
      dependencies:
        patterns:
          - "*"
